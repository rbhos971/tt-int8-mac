# Tiny Tapeout project information
project:
  title:        "INT8 Weight-Stationary MAC"      # Project title
  author:       "Rohan Bhosale"      # Your name
  discord:      "skyhive"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Pipelined signed INT8 multiply-accumulate unit with a 24-bit accumulator"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_rbhos971_int8_mac"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "mac.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA[0]"
  ui[1]: "DATA[1]"
  ui[2]: "DATA[2]"
  ui[3]: "DATA[3]"
  ui[4]: "DATA[4]"
  ui[5]: "DATA[5]"
  ui[6]: "DATA[6]"
  ui[7]: "DATA[7]"
  # Output
  uo[0]: "ACC_BYTE[0]"
  uo[1]: "ACC_BYTE[1]"
  uo[2]: "ACC_BYTE[2]"
  uo[3]: "ACC_BYTE[3]"
  uo[4]: "ACC_BYTE[4]"
  uo[5]: "ACC_BYTE[5]"
  uo[6]: "ACC_BYTE[6]"
  uo[7]: "ACC_BYTE[7]"

  # Bidirectional pins
  uio[0]: "OP[0]"
  uio[1]: "OP[1]"
  uio[2]: "BYTE_SEL[0]"
  uio[3]: "BYTE_SEL[1]"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "VALID"
  uio[7]: "OVERFLOW"

# Do not change!
yaml_version: 6
